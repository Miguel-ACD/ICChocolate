services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - photo_data:/app/private_photos
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS},${ICCHOCOLATE_WEB_BIND:-127.0.0.1}
    ports:
      - "127.0.0.1:8001:8000"
      - "${ICCHOCOLATE_WEB_BIND:-127.0.0.1}:8003:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--timeout", "60"]
  sensor-gateway:
    build: .
    restart: unless-stopped
    environment:
      SENSOR_UPSTREAM_HOST: web
      SENSOR_UPSTREAM_PORT: "8000"
      SENSOR_GATEWAY_HOST: 0.0.0.0
      SENSOR_GATEWAY_PORT: "8002"
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      - web
    command: ["python", "config/sensor_gateway.py"]
  worker:
    build: .
    env_file: .env
    volumes:
      - photo_data:/app/private_photos
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "manage.py", "alert_worker"]
volumes:
  postgres_data:
  photo_data:
